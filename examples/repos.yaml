# Public-safe synthetic example config.
# Replace these paths locally; do not commit private paths or secrets.
repos:
  - name: example-python-service
    path: /path/to/example-python-service
    enabled: true
    required: false
    timeout_seconds: 300
    checks:
      - git-status
      - docs
      - static-search
      - dependency-metadata
      # Source review requires --llm mode. In --no-llm mode it is reported as
      # skipped instead of producing semantic findings.
      - source-review
    safe_commands: {}
    source_roots:
      - src
      - tests
    source_review_max_files: 20
    source_review_max_bytes_per_file: 12000
    source_review_max_total_bytes: 80000
    notes: "Synthetic public-safe example repository."

report:
  output_dir: reports
  filename_prefix: routine-maintenance
  update_latest: true
  discord_enabled: false
