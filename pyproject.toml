[project]
name = "langgraph-maintenance-agent"
version = "0.1.0"
description = "Public-safe LangGraph routine maintenance reporting agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=0.2.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.0",
]

[project.scripts]
langgraph-maintenance = "langgraph_maintenance_agent.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["langgraph_maintenance_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
